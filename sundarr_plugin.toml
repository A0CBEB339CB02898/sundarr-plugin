manifest_version = 2

[[plugins]]
id = "tmdb-catalog"
name = "TMDb 目录"
version = "0.1.0"
plugin_type = "catalog_provider"
description = "提供电影与剧集搜索、热门、分类、详情和海报目录数据。"
author = "Sundarr Team"
homepage_url = "https://github.com/A0CBEB339CB02898/sundarr-plugin"
plugin_api_version = "1.0"
entry = "plugin_entry:activate_tmdb_catalog"

[plugins.runtime]
requires = ["core.http.v1", "core.catalog_registry.v1"]
provides = [
  "catalog.search.v1",
  "catalog.trending.v1",
  "catalog.categories.v1",
  "catalog.detail.v1",
]

[plugins.config_schema.api_read_access_token]
type = "password"
label = "TMDb API Read Access Token"
required = true
secret = true
placeholder = "请输入 TMDb API Read Access Token"

[plugins.config_schema.language]
type = "string"
label = "目录语言"
required = false
default = "zh-CN"
placeholder = "例如 zh-CN"

[plugins.config_schema.include_adult]
type = "boolean"
label = "包含成人内容"
required = false
default = false

[plugins.config_schema.image_size]
type = "select"
label = "图片尺寸"
required = false
default = "w500"
options = ["w342", "w500", "w780", "original"]
